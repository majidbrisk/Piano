<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161b">
<title>Piano Note Quiz</title>
<style>
  :root {
    --lacquer: #12161b;
    --panel: #1c232b;
    --paper: #eef1f4;
    --ink: #1b2430;
    --brass: #e0b341;
    --good: #2e9e6b;
    --bad: #d64550;
    --muted: #8b97a5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--lacquer);
    color: #e8edf2;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
    max-width: 560px; margin: 0 auto;
  }
  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 10px; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .score { display: flex; gap: 14px; font-size: 14px; color: var(--muted); }
  .score b { color: #fff; font-size: 17px; margin-left: 4px; }

  .staff-card {
    background: var(--paper); border-radius: 18px; padding: 10px;
    flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center;
    border: 4px solid transparent; transition: border-color .15s, background .15s;
    position: relative;
  }
  .staff-card.good { border-color: var(--good); }
  .staff-card.bad { border-color: var(--bad); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .staff-card.bad { animation: none; } }
  svg#staff { width: 100%; height: 100%; max-height: 52vh; }
  .clef-tag { position: absolute; left: 14px; top: 10px; font-size: 13px; color: #5d6b7a; }

  .status { text-align: center; padding: 14px 0 6px; min-height: 76px; }
  .status .big { font-size: 22px; font-weight: 650; }
  .status .small { font-size: 14px; color: var(--muted); margin-top: 4px; }
  .status.good .big { color: var(--good); }
  .status.bad .big { color: var(--bad); }

  .meter { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 14px; color: var(--muted); padding-bottom: 12px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #3a4552; }
  .dot.on { background: var(--brass); }

  .row { display: flex; gap: 10px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 15px 18px;
    background: var(--panel); color: #e8edf2; flex: 1; cursor: pointer;
  }
  button.primary { background: var(--brass); color: #20180a; font-size: 17px; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .opts { display: flex; gap: 12px; align-items: center; margin-top: 12px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
  select { font: inherit; background: var(--panel); color: #e8edf2; border: 0; border-radius: 10px; padding: 9px 10px; }
  label.chk { display: flex; align-items: center; gap: 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Piano Note Quiz</h1>
  <div class="score">
    <span>Score<b id="score">0</b></span>
    <span>Streak<b id="streak">0</b></span>
  </div>
</header>

<div class="staff-card" id="card">
  <span class="clef-tag" id="clefTag"></span>
  <svg id="staff" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<div class="status" id="status">
  <div class="big">Ready when you are</div>
  <div class="small">Tap Start, then play the note on your piano.</div>
</div>

<div class="meter" id="meter">
  <span class="dot" id="dot"></span>
  <span id="heard">Heard: —</span>
</div>

<div class="row">
  <button class="primary" id="startBtn">Start listening</button>
  <button id="skipBtn" class="hidden">Skip note</button>
</div>

<div class="opts">
  <label>Clef
    <select id="clefSel">
      <option value="both">Both</option>
      <option value="treble">Treble only</option>
      <option value="bass">Bass only</option>
    </select>
  </label>
  <label class="chk"><input type="checkbox" id="accChk" checked> Sharps and flats</label>
</div>

<script>
(() => {
  // ---------- Music helpers ----------
  const LOW = 21, HIGH = 108;                         // A0 .. C8 (88 keys)
  const NAMES_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const NAMES_FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
  const LETTER_IDX  = { C:0, D:1, E:2, F:3, G:4, A:5, B:6 };
  const NATURAL = new Set([0,2,4,5,7,9,11]);

  function spell(midi, useFlat) {
    const pc = midi % 12, oct = Math.floor(midi / 12) - 1;
    const name = (useFlat ? NAMES_FLAT : NAMES_SHARP)[pc];
    return { midi, name, letter: name[0], acc: name.length > 1 ? (name[1] === '#' ? '♯' : '♭') : '', oct };
  }
  const label = n => n.name.replace('#','♯').replace('b','♭') + n.oct;
  const plainLabel = m => label(spell(m, false));

  // ---------- Staff drawing ----------
  const svg = document.getElementById('staff');
  const NS = 'http://www.w3.org/2000/svg';
  const STEP = 8;                // half a line gap in px
  const W = 300;

  function el(tag, attrs, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text) e.textContent = text;
    svg.appendChild(e);
    return e;
  }

  function drawNote(note, clef) {
    svg.innerHTML = '';
    // diatonic index; bottom line: treble E4, bass G2
    const d = note.oct * 7 + LETTER_IDX[note.letter];
    const dBottom = clef === 'treble' ? 4*7+2 : 2*7+4;
    const off = d - dBottom;                          // half-steps above bottom line
    const minOff = Math.min(0, off) - 3;
    const maxOff = Math.max(8, off) + 3;
    // y for an offset: higher offset => smaller y
    const yTop = 0, total = (maxOff - minOff) * STEP;
    const y = o => (maxOff - o) * STEP;
    svg.setAttribute('viewBox', `0 0 ${W} ${total}`);

    // staff lines
    for (let i = 0; i <= 4; i++) {
      el('line', { x1: 20, x2: W - 20, y1: y(i*2), y2: y(i*2), stroke: '#1b2430', 'stroke-width': 1.6 });
    }
    // clef glyph (anchored to staff)
    const clefChar = clef === 'treble' ? '\u{1D11E}' : '\u{1D122}';
    const clefSize = clef === 'treble' ? 8*STEP*1.55 : 8*STEP*1.15;
    const clefY = clef === 'treble' ? y(1) + STEP*0.2 : y(5.3);
    const g = el('text', {
      x: 28, y: clefY, 'font-size': clefSize, fill: '#1b2430',
      'font-family': '"Noto Music","Segoe UI Symbol","Apple Symbols","Bravura Text",serif'
    }, clefChar);

    // ledger lines
    const nx = 180;
    const ledger = o => el('line', { x1: nx - 22, x2: nx + 22, y1: y(o), y2: y(o), stroke: '#1b2430', 'stroke-width': 1.6 });
    if (off < 0)      for (let o = -2; o >= off; o -= 2) ledger(o);
    else if (off > 8) for (let o = 10; o <= off; o += 2) ledger(o);

    // accidental
    if (note.acc) {
      el('text', { x: nx - 48, y: y(off) + STEP*0.9, 'font-size': STEP*3.4, fill: '#1b2430',
        'font-family': '"Noto Music","Segoe UI Symbol",serif' }, note.acc);
    }
    // notehead
    el('ellipse', { cx: nx, cy: y(off), rx: STEP*1.45, ry: STEP*1.0, fill: '#1b2430',
      transform: `rotate(-18 ${nx} ${y(off)})` });
    // stem
    const up = off < 4;
    if (up) el('line', { x1: nx + STEP*1.35, x2: nx + STEP*1.35, y1: y(off), y2: y(off) - STEP*7, stroke: '#1b2430', 'stroke-width': 2 });
    else    el('line', { x1: nx - STEP*1.35, x2: nx - STEP*1.35, y1: y(off), y2: y(off) + STEP*7, stroke: '#1b2430', 'stroke-width': 2 });
  }

  // ---------- Quiz state ----------
  const $ = id => document.getElementById(id);
  const card = $('card'), statusEl = $('status');
  let target = null, clef = 'treble', prevMidi = -1;
  let score = 0, streak = 0;

  function pickNote() {
    const mode = $('clefSel').value;
    const acc = $('accChk').checked;
    let lo = LOW, hi = HIGH;
    if (mode === 'treble') lo = 60;
    if (mode === 'bass')   hi = 59;
    let m, tries = 0;
    do {
      m = lo + Math.floor(Math.random() * (hi - lo + 1));
      tries++;
    } while ((m === prevMidi || (!acc && !NATURAL.has(m % 12))) && tries < 200);
    prevMidi = m;
    clef = m >= 60 ? 'treble' : 'bass';
    target = spell(m, Math.random() < 0.5);
    drawNote(target, clef);
    $('clefTag').textContent = clef === 'treble' ? 'Treble clef' : 'Bass clef';
  }

  function setStatus(kind, big, small) {
    statusEl.className = 'status ' + (kind || '');
    statusEl.innerHTML = `<div class="big">${big}</div><div class="small">${small || ''}</div>`;
    card.classList.remove('good', 'bad');
    void card.offsetWidth;
    if (kind) card.classList.add(kind);
  }

  function onCorrect() {
    score++; streak++;
    $('score').textContent = score; $('streak').textContent = streak;
    setStatus('good', 'Correct ✓', `${label(target)} — next note…`);
    locked = true;
    setTimeout(() => {
      pickNote();
      setStatus('', 'Play this note', 'Listening…');
      locked = false;
    }, 900);
  }

  function onWrong(playedMidi) {
    streak = 0; $('streak').textContent = 0;
    setStatus('bad', 'Incorrect ✗', `You played ${plainLabel(playedMidi)}. Try again.`);
  }

  // ---------- Pitch detection (YIN) ----------
  let audioCtx, analyser, buf, timer, stream;
  const THRESH = 0.12;

  function detectPitch(data, sr) {
    const half = data.length >> 1;
    // silence gate
    let rms = 0;
    for (let i = 0; i < data.length; i++) rms += data[i] * data[i];
    rms = Math.sqrt(rms / data.length);
    if (rms < 0.008) return { f: null, rms };

    const minTau = Math.floor(sr / 4500);
    const maxTau = Math.min(half - 1, Math.floor(sr / 24));
    const cm = new Float32Array(maxTau + 1);
    cm[0] = 1;
    let run = 0, tauFound = -1;
    for (let tau = 1; tau <= maxTau; tau++) {
      let s = 0;
      for (let j = 0; j < half; j++) {
        const diff = data[j] - data[j + tau];
        s += diff * diff;
      }
      run += s;
      cm[tau] = run === 0 ? 1 : s * tau / run;
      if (tau >= minTau && cm[tau] < THRESH) {
        while (tau + 1 <= maxTau) {                   // walk to local minimum
          const s2 = (() => { let a = 0; for (let j = 0; j < half; j++) { const df = data[j] - data[j + tau + 1]; a += df * df; } return a; })();
          const next = s2 * (tau + 1) / (run + s2);
          if (next < cm[tau]) { tau++; run += s2; cm[tau] = next; } else break;
        }
        tauFound = tau; break;
      }
    }
    if (tauFound < 0) return { f: null, rms };
    // parabolic interpolation
    let t = tauFound;
    if (t > 1 && t < maxTau) {
      const a = cm[t-1], b = cm[t], c = cm[t+1] ?? cm[t];
      const den = a - 2*b + c;
      if (den !== 0) t = t + (a - c) / (2 * den);
    }
    return { f: sr / t, rms };
  }

  let locked = false, suppress = null, hist = [], silent = 0;

  function tick() {
    if (!analyser) return;
    analyser.getFloatTimeDomainData(buf);
    const { f } = detectPitch(buf, audioCtx.sampleRate);
    let midi = null;
    if (f && f > 24 && f < 4500) {
      midi = Math.round(69 + 12 * Math.log2(f / 440));
      if (midi < LOW || midi > HIGH) midi = null;
    }
    $('dot').classList.toggle('on', midi !== null);
    $('heard').textContent = 'Heard: ' + (midi !== null ? plainLabel(midi) : '—');

    if (midi === null) {
      silent++; hist = [];
      if (silent >= 5) suppress = null;               // string stopped ringing: new press allowed
      return;
    }
    silent = 0;
    hist.push(midi); if (hist.length > 3) hist.shift();
    if (hist.length < 3 || !hist.every(m => m === midi)) return;   // need 3 matching readings
    if (locked || midi === suppress) return;

    suppress = midi;
    if (midi === target.midi) onCorrect();
    else onWrong(midi);
  }

  async function start() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
      });
    } catch (e) {
      setStatus('bad', 'Microphone blocked',
        'Allow microphone access for this page in your browser settings, then tap Start again.');
      return;
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    await audioCtx.resume();
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 8192;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    timer = setInterval(tick, 60);

    $('startBtn').textContent = 'Stop';
    $('startBtn').classList.remove('primary');
    $('skipBtn').classList.remove('hidden');
    locked = false; suppress = null; hist = [];
    setStatus('', 'Play this note', 'Listening…');
  }

  function stop() {
    clearInterval(timer);
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    analyser = null; audioCtx = null; stream = null;
    $('startBtn').textContent = 'Start listening';
    $('startBtn').classList.add('primary');
    $('skipBtn').classList.add('hidden');
    $('dot').classList.remove('on');
    $('heard').textContent = 'Heard: —';
    setStatus('', 'Paused', 'Tap Start to continue.');
  }

  $('startBtn').addEventListener('click', () => analyser ? stop() : start());
  $('skipBtn').addEventListener('click', () => {
    streak = 0; $('streak').textContent = 0;
    pickNote(); suppress = null;
    setStatus('', 'Play this note', 'Listening…');
  });
  $('clefSel').addEventListener('change', pickNote);
  $('accChk').addEventListener('change', pickNote);

  pickNote();
})();
</script>
</body>
</html>
